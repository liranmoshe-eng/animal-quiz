<!doctype html>
<html lang="he" dir="rtl" class="h-full">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>יש על מה להישען — תרגול הארקה</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Alef:wght@400;700&family=Frank+Ruhl+Libre:wght@500;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --moss: #2f4a3c;
      --moss-deep: #1e3229;
      --sage: #7d9b88;
      --mist: #d7e4dc;
      --fog: #eef4f0;
      --dawn: #f3ebe0;
      --ink: #24332c;
      --soft: #5a7264;
      --pause: #9bb5a6;
    }

    * { box-sizing: border-box; }

    html, body {
      height: 100%;
      margin: 0;
    }

    body {
      font-family: "Alef", "Segoe UI", sans-serif;
      color: var(--ink);
      background:
        radial-gradient(120% 80% at 80% 10%, rgba(243, 235, 224, 0.85) 0%, transparent 55%),
        radial-gradient(90% 70% at 10% 90%, rgba(125, 155, 136, 0.35) 0%, transparent 50%),
        linear-gradient(165deg, #e8f0ea 0%, #d5e3d9 42%, #c7d8cd 100%);
      overflow: hidden;
    }

    .atmosphere {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
    }

    .drift {
      position: absolute;
      border-radius: 50%;
      filter: blur(40px);
      opacity: 0.45;
      animation: drift 22s ease-in-out infinite;
    }

    .drift-a {
      width: 42vw;
      height: 42vw;
      top: -8%;
      right: -6%;
      background: #f7efe4;
      animation-delay: 0s;
    }

    .drift-b {
      width: 36vw;
      height: 36vw;
      bottom: -10%;
      left: -8%;
      background: #9fb9a8;
      animation-delay: -7s;
    }

    .drift-c {
      width: 28vw;
      height: 28vw;
      top: 40%;
      left: 35%;
      background: #c9dccf;
      opacity: 0.35;
      animation-delay: -13s;
    }

    @keyframes drift {
      0%, 100% { transform: translate(0, 0) scale(1); }
      50% { transform: translate(2%, -3%) scale(1.06); }
    }

    .screen {
      position: relative;
      z-index: 1;
      min-height: 100%;
      display: flex;
      flex-direction: column;
    }

    /* —— Landing —— */
    #landing {
      min-height: 100dvh;
      display: grid;
      place-items: center;
      padding: 2rem 1.25rem 3rem;
      text-align: center;
    }

    #landing.hidden { display: none; }

    .hero {
      max-width: 34rem;
      width: 100%;
    }

    .brand {
      font-family: "Frank Ruhl Libre", Georgia, serif;
      font-weight: 700;
      font-size: clamp(2.4rem, 8vw, 3.75rem);
      line-height: 1.15;
      color: var(--moss-deep);
      margin: 0 0 1rem;
      letter-spacing: -0.01em;
      animation: riseIn 1.1s ease-out both;
    }

    .tagline {
      font-size: clamp(1.05rem, 3.2vw, 1.25rem);
      line-height: 1.55;
      color: var(--soft);
      margin: 0 auto 2.25rem;
      max-width: 22rem;
      animation: riseIn 1.1s ease-out 0.15s both;
    }

    .start-btn {
      appearance: none;
      border: 0;
      background: var(--moss);
      color: var(--fog);
      font-family: inherit;
      font-size: 1.1rem;
      font-weight: 700;
      padding: 0.95rem 2.4rem;
      border-radius: 999px;
      cursor: pointer;
      transition: background 0.25s ease, transform 0.25s ease;
      animation: riseIn 1.1s ease-out 0.3s both;
    }

    .start-btn:hover {
      background: var(--moss-deep);
      transform: translateY(-2px);
    }

    .start-btn:focus-visible {
      outline: 3px solid var(--sage);
      outline-offset: 3px;
    }

    .hint {
      margin-top: 1.35rem;
      font-size: 0.92rem;
      color: var(--sage);
      animation: riseIn 1.1s ease-out 0.45s both;
    }

    @keyframes riseIn {
      from { opacity: 0; transform: translateY(14px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* —— Practice —— */
    #practice {
      display: none;
      min-height: 100dvh;
      flex-direction: column;
      padding: 1rem 1.25rem 1.5rem;
    }

    #practice.active { display: flex; }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.75rem;
      margin-bottom: 0.5rem;
    }

    .brand-mini {
      font-family: "Frank Ruhl Libre", Georgia, serif;
      font-size: 1.05rem;
      color: var(--moss);
      margin: 0;
    }

    .controls {
      display: flex;
      gap: 0.5rem;
    }

    .ctrl {
      appearance: none;
      border: 1px solid rgba(47, 74, 60, 0.22);
      background: rgba(238, 244, 240, 0.65);
      color: var(--moss-deep);
      font-family: inherit;
      font-size: 0.88rem;
      padding: 0.45rem 0.85rem;
      border-radius: 999px;
      cursor: pointer;
      transition: background 0.2s ease;
    }

    .ctrl:hover { background: rgba(238, 244, 240, 0.95); }
    .ctrl:focus-visible {
      outline: 2px solid var(--sage);
      outline-offset: 2px;
    }

    .progress-track {
      height: 3px;
      background: rgba(47, 74, 60, 0.12);
      border-radius: 999px;
      overflow: hidden;
      margin-bottom: 1.25rem;
    }

    .progress-fill {
      height: 100%;
      width: 0%;
      background: var(--moss);
      border-radius: inherit;
      transition: width 0.6s ease;
    }

    .stage {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      max-width: 38rem;
      margin: 0 auto;
      width: 100%;
      gap: 1.75rem;
    }

    .breath {
      width: clamp(4.5rem, 16vw, 6.5rem);
      height: clamp(4.5rem, 16vw, 6.5rem);
      border-radius: 50%;
      background: radial-gradient(circle at 35% 30%, #f7f2ea, #9fb9a8 55%, #6f917c 100%);
      opacity: 0.55;
      transform: scale(0.92);
      transition: opacity 0.8s ease;
    }

    .breath.speaking {
      animation: restPulse 5.5s ease-in-out infinite;
      opacity: 0.4;
    }

    .breath.pausing {
      opacity: 0.85;
      animation: pauseBreathe 8s ease-in-out infinite;
    }

    @keyframes restPulse {
      0%, 100% { transform: scale(0.9); }
      50% { transform: scale(1); }
    }

    @keyframes pauseBreathe {
      0%, 100% { transform: scale(0.88); opacity: 0.7; }
      50% { transform: scale(1.08); opacity: 0.95; }
    }

    .text-panel {
      min-height: 10rem;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .guide-text {
      font-size: clamp(1.15rem, 3.6vw, 1.45rem);
      line-height: 1.75;
      color: var(--ink);
      margin: 0;
      max-width: 34rem;
      white-space: pre-line;
      opacity: 0;
      transform: translateY(10px);
      transition: opacity 0.7s ease, transform 0.7s ease;
    }

    .guide-text.visible {
      opacity: 1;
      transform: translateY(0);
    }

    .guide-text.pause-label {
      font-family: "Frank Ruhl Libre", Georgia, serif;
      font-size: clamp(1.35rem, 4vw, 1.7rem);
      color: var(--moss);
    }

    .status {
      font-size: 0.9rem;
      color: var(--sage);
      min-height: 1.4em;
      letter-spacing: 0.02em;
    }

    /* —— Done —— */
    #done {
      display: none;
      min-height: 100dvh;
      place-items: center;
      padding: 2rem 1.25rem;
      text-align: center;
    }

    #done.active { display: grid; }

    #done h2 {
      font-family: "Frank Ruhl Libre", Georgia, serif;
      font-size: clamp(2rem, 6vw, 2.8rem);
      color: var(--moss-deep);
      margin: 0 0 0.85rem;
    }

    #done p {
      color: var(--soft);
      font-size: 1.1rem;
      margin: 0 0 2rem;
      line-height: 1.6;
    }

    @media (max-width: 480px) {
      .topbar { flex-wrap: wrap; }
      .brand-mini { width: 100%; text-align: center; }
      .controls { width: 100%; justify-content: center; }
    }

    @media (prefers-reduced-motion: reduce) {
      .drift, .breath.speaking, .breath.pausing { animation: none; }
      .brand, .tagline, .start-btn, .hint { animation: none; }
      .guide-text { transition: none; }
    }
  </style>
</head>
<body>
  <div class="atmosphere" aria-hidden="true">
    <div class="drift drift-a"></div>
    <div class="drift drift-b"></div>
    <div class="drift drift-c"></div>
  </div>

  <div class="screen">
    <section id="landing" aria-label="פתיחה">
      <div class="hero">
        <h1 class="brand">יש על מה להישען</h1>
        <p class="tagline">תרגול הארקה קצר. אפשר לעצום עיניים, ואפשר להשאיר אותן פתוחות.</p>
        <button type="button" class="start-btn" id="startBtn">בואו נתחיל</button>
        <p class="hint">כ־6 דקות · אפשר לעצור בכל רגע</p>
      </div>
    </section>

    <section id="practice" aria-live="polite" aria-label="תרגול">
      <div class="topbar">
        <p class="brand-mini">יש על מה להישען</p>
        <div class="controls">
          <button type="button" class="ctrl" id="toggleVoice" aria-pressed="false" title="הקראה בקול">קול: כבוי</button>
          <button type="button" class="ctrl" id="nextBtn">הבא</button>
          <button type="button" class="ctrl" id="pauseBtn">השהיה</button>
          <button type="button" class="ctrl" id="endBtn">סיום</button>
        </div>
      </div>
      <div class="progress-track" aria-hidden="true">
        <div class="progress-fill" id="progressFill"></div>
      </div>
      <div class="stage">
        <div class="breath speaking" id="breath" aria-hidden="true"></div>
        <div class="text-panel">
          <p class="guide-text" id="guideText"></p>
        </div>
        <p class="status" id="status"></p>
      </div>
    </section>

    <section id="done" aria-label="סיום">
      <div>
        <h2>אפשר להמשיך מכאן</h2>
        <p>הרגליים על הרצפה. הכיסא תומך. קחו עוד רגע, בקצב שלכן.</p>
        <button type="button" class="start-btn" id="restartBtn">להתחיל שוב</button>
      </div>
    </section>
  </div>

  <script>
    const SEGMENTS = [
      {
        text: "שלום לכולן.\n\nאני מזמינה אתכן לשבת בנוחות. אפשר לעצום עיניים, ואפשר להשאיר אותן פתוחות ולהסתכל על נקודה בחדר.\n\nבכל רגע אפשר לזוז ולשנות תנוחה. אין צורך להישאר בתנוחה שלא נוחה לכן.\n\nאין כאן הצלחה או כישלון. אם עולות מחשבות או שתשומת הלב נודדת, זה בסדר. אפשר לשים לב לזה בלי לשפוט את עצמכן, ולחזור בעדינות להרגיש את תמיכת הכיסא.\n\nאפשר לתת לעצמכן את הרגע הזה.\n\nקחו לכן רגע להתמקם.",
        pauseMs: 15000
      },
      {
        text: "הניחו את כפות הרגליים על הרצפה. מצאו להן מקום נוח, ושימו לב לרצפה היציבה שמתחתיהן.\n\nאפשר פשוט לתת לרגליים לנוח שם. הרצפה תומכת בהן. לא צריך לעשות דבר כרגע.",
        pauseMs: 20000
      },
      {
        text: "שימו לב לכיסא שמתחתיכן. אפשר לזוז מעט ולמצוא תנוחה נוחה, ואם מתאים לכן — להישען לאחור.\n\nהרגישו את המושב שתומך בכן מלמטה ואת המשענת שתומכת בגב.",
        pauseMs: 10000
      },
      {
        text: "יש על מה להישען.\n\nאפשר לתת לגב לנוח, ולהישאר כך לרגע.",
        pauseMs: 30000
      },
      {
        text: "הניחו גם לידיים לנוח — על הירכיים, בחיק או על ידיות הכיסא.\n\nאם נעים לכן, אפשר לעטוף את עצמכן בחיבוק רך ולהניח את כפות הידיים על הזרועות. אפשר גם להשאיר אותן מונחות, איך שנוח לכן.\n\nקחו רגע להרגיש את המגע. אולי את החום של הידיים, אולי את תחושת העיטוף.\n\nאם בחרתן בחיבוק, אפשר להתאים אותו כך שיהיה נעים לכן.",
        pauseMs: 20000
      },
      {
        text: "אפשר לתת לכתפיים לנוח מעט. להניח גם ללסת ולפנים להתרכך, במידה שמתאפשרת.\n\nהנשימה יכולה להמשיך בקצב שלה. אין צורך לשנות אותה.\n\nבזמן שאתן נושמות, הכיסא ממשיך לתמוך בכן. התמיכה נשארת שם.",
        pauseMs: 20000
      },
      {
        text: "ועכשיו קחו רגע להרגיש איך אתן יושבות.\n\nהרגליים מונחות על הרצפה. הכיסא תומך בכן מלמטה ומאחור. הידיים נחות או עוטפות.\n\nיש על מה להישען. אפשר לנוח כאן לרגע.\n\nאם נוח יותר להקשיב לקולות בחדר או להסתכל על משהו מולכן, אפשר גם כך.\n\nאין כאן נכון ולא נכון. אפשר לקבל את מה שאתן מרגישות כרגע, בלי לנסות לשנות אותו.",
        pauseMs: 30000
      },
      {
        text: "לאט־לאט נפנה שוב את תשומת הלב לחדר.\n\nהקשיבו לקולות שסביבכן — בתוך החדר, ואולי גם מחוצה לו.\n\nהתחילו להזיז מעט את אצבעות הידיים והרגליים.\n\nמי שעצמה עיניים יכולה לפתוח אותן בקצב שלה. הסתכלו סביב. שימו לב לאור, לצבעים ולדברים שנמצאים בחדר. אולי אתן מבחינות גם בריח כלשהו.\n\nאין צורך לחפש. רק לשים לב למה שאתן קולטות עכשיו.",
        pauseMs: 15000
      },
      {
        text: "אפשר להתמתח מעט ולשנות תנוחה.\n\nהרגישו שוב את הרגליים על הרצפה ואת הכיסא שתומך בכן, גם כשאתן מתחילות לזוז.\n\nקחו עוד רגע, בקצב שלכן, לפני שנמשיך.",
        pauseMs: 0
      }
    ];

    const landing = document.getElementById("landing");
    const practice = document.getElementById("practice");
    const done = document.getElementById("done");
    const guideText = document.getElementById("guideText");
    const statusEl = document.getElementById("status");
    const breath = document.getElementById("breath");
    const progressFill = document.getElementById("progressFill");
    const pauseBtn = document.getElementById("pauseBtn");
    const toggleVoice = document.getElementById("toggleVoice");

    let index = 0;
    let paused = false;
    let voiceOn = false;
    let aborted = false;
    let timerId = null;
    let resumeWait = null;
    let remainingMs = 0;
    let sliceStartedAt = 0;
    let sessionToken = 0;

    function readingMs(text) {
      const chars = text.replace(/\s+/g, "").length;
      return Math.max(6000, Math.round(chars * 95));
    }

    function clearTimer() {
      if (timerId) {
        clearTimeout(timerId);
        timerId = null;
      }
    }

    function holdForPauseToggle() {
      if (!timerId) return;
      clearTimeout(timerId);
      timerId = null;
      remainingMs = Math.max(0, remainingMs - (Date.now() - sliceStartedAt));
    }

    let skipCurrentWait = null;

    function wait(ms) {
      remainingMs = ms;
      return new Promise((resolve) => {
        const finish = (reason) => {
          clearTimer();
          resumeWait = null;
          skipCurrentWait = null;
          remainingMs = 0;
          resolve(reason);
        };

        skipCurrentWait = () => finish(aborted ? "aborted" : "ok");

        const step = () => {
          if (aborted) {
            finish("aborted");
            return;
          }
          if (paused) {
            resumeWait = () => {
              resumeWait = null;
              step();
            };
            return;
          }
          sliceStartedAt = Date.now();
          clearTimer();
          timerId = setTimeout(() => finish(aborted ? "aborted" : "ok"), remainingMs);
        };
        step();
      });
    }

    function setProgress() {
      progressFill.style.width = `${(index / SEGMENTS.length) * 100}%`;
    }

    function showText(text, isPause) {
      guideText.classList.remove("visible");
      guideText.classList.toggle("pause-label", !!isPause);
      return new Promise((resolve) => {
        setTimeout(() => {
          guideText.textContent = text;
          guideText.classList.add("visible");
          resolve();
        }, 280);
      });
    }

    function pickHebrewVoice() {
      const voices = window.speechSynthesis?.getVoices?.() || [];
      return (
        voices.find((v) => v.lang === "he-IL") ||
        voices.find((v) => v.lang?.startsWith("he")) ||
        null
      );
    }

    let skipSpeak = null;

    function speak(text) {
      return new Promise((resolve) => {
        if (!voiceOn || !window.speechSynthesis) {
          resolve("skip");
          return;
        }
        window.speechSynthesis.cancel();
        const u = new SpeechSynthesisUtterance(text.replace(/\n+/g, " "));
        u.lang = "he-IL";
        u.rate = 0.92;
        const voice = pickHebrewVoice();
        if (voice) u.voice = voice;
        const done = (reason) => {
          skipSpeak = null;
          resolve(reason);
        };
        skipSpeak = () => {
          try { window.speechSynthesis.cancel(); } catch (_) {}
          done("skip");
        };
        u.onend = () => done("ok");
        u.onerror = () => done("error");
        window.speechSynthesis.speak(u);
      });
    }

    function stopSpeech() {
      try { window.speechSynthesis?.cancel(); } catch (_) {}
    }

    async function runPause(ms, token) {
      if (!ms || aborted || token !== sessionToken) return;
      breath.classList.remove("speaking");
      breath.classList.add("pausing");
      await showText("יש על מה להישען", true);
      if (aborted || token !== sessionToken) return;
      statusEl.textContent = "רגע של שקט";
      await wait(ms);
      if (aborted || token !== sessionToken) return;
      statusEl.textContent = "";
      breath.classList.remove("pausing");
      breath.classList.add("speaking");
    }

    async function runSegment(segment, token) {
      await showText(segment.text, false);
      if (aborted || token !== sessionToken) return;
      statusEl.textContent = voiceOn ? "הקראה…" : "קחו את הזמן לקרוא";

      if (voiceOn) {
        await speak(segment.text);
        if (aborted || token !== sessionToken) return;
        await wait(900);
      } else {
        await wait(readingMs(segment.text));
      }
      if (aborted || token !== sessionToken) return;
      statusEl.textContent = "";
      await runPause(segment.pauseMs, token);
    }

    async function startPractice() {
      aborted = false;
      paused = false;
      index = 0;
      sessionToken += 1;
      const token = sessionToken;
      pauseBtn.textContent = "השהיה";
      landing.classList.add("hidden");
      done.classList.remove("active");
      practice.classList.add("active");
      breath.classList.add("speaking");
      breath.classList.remove("pausing");
      setProgress();

      for (; index < SEGMENTS.length; index++) {
        if (aborted || token !== sessionToken) break;
        setProgress();
        await runSegment(SEGMENTS[index], token);
        if (aborted || token !== sessionToken) break;
      }

      if (!aborted && token === sessionToken) {
        progressFill.style.width = "100%";
        finishPractice(false);
      }
    }

    function finishPractice(fromUser) {
      aborted = true;
      sessionToken += 1;
      clearTimer();
      resumeWait = null;
      skipCurrentWait = null;
      if (skipSpeak) skipSpeak();
      stopSpeech();
      practice.classList.remove("active");
      if (fromUser) {
        landing.classList.remove("hidden");
        done.classList.remove("active");
      } else {
        done.classList.add("active");
      }
      index = 0;
      paused = false;
    }

    document.getElementById("startBtn").addEventListener("click", startPractice);
    document.getElementById("restartBtn").addEventListener("click", () => {
      done.classList.remove("active");
      startPractice();
    });

    document.getElementById("endBtn").addEventListener("click", () => {
      finishPractice(false);
    });

    pauseBtn.addEventListener("click", () => {
      paused = !paused;
      pauseBtn.textContent = paused ? "חידוש" : "השהיה";
      if (paused) {
        statusEl.textContent = "מושהה";
        holdForPauseToggle();
        stopSpeech();
      } else {
        statusEl.textContent = "";
        if (resumeWait) resumeWait();
      }
    });

    document.getElementById("nextBtn").addEventListener("click", () => {
      if (paused) {
        paused = false;
        pauseBtn.textContent = "השהיה";
        statusEl.textContent = "";
      }
      if (skipSpeak) skipSpeak();
      else stopSpeech();
      if (skipCurrentWait) skipCurrentWait();
      else if (resumeWait) resumeWait();
    });

    toggleVoice.addEventListener("click", () => {
      voiceOn = !voiceOn;
      toggleVoice.setAttribute("aria-pressed", String(voiceOn));
      toggleVoice.textContent = voiceOn ? "קול: פעיל" : "קול: כבוי";
      if (!voiceOn) stopSpeech();
      if (voiceOn && window.speechSynthesis) window.speechSynthesis.getVoices();
    });

    if (window.speechSynthesis) {
      window.speechSynthesis.onvoiceschanged = () => { pickHebrewVoice(); };
    }
  </script>
</body>
</html>
